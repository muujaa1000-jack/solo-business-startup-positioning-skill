name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION (v${version})." >&2
            exit 1
          fi
      - name: Run contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository
        run: python scripts/validate.py
      - name: Build and verify artifacts
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          name="interview-solo-business-startup-positioning-${version}"
          python scripts/package.py
          python scripts/verify_artifacts.py "dist/${name}.zip" "dist/${name}.skill"
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          name="interview-solo-business-startup-positioning-${version}"
          zip_path="dist/${name}.zip"
          skill_path="dist/${name}.skill"
          sums_path="dist/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip_path" "$skill_path" "$sums_path" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$zip_path" "$skill_path" "$sums_path" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
